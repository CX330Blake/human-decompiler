name: Release dist archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create dist archive
        run: zip -r human-decompiler-dist.zip dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            human-decompiler-dist.zip \
            --target "${GITHUB_SHA}" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --latest
